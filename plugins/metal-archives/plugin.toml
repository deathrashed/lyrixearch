id = "metal_archives"
name = "Metal Archives"
# Built once when the plugin is installed (needs Rust: https://rustup.rs), then run per track.
build = ["cargo", "build", "--release", "--quiet"]
build_hint = "needs Rust (cargo): https://rustup.rs"
command = ["target/release/metal-archives-lyrics"]
# Metal Archives is a small community site: one lookup at a time, with a pause between them.
timeout_secs = 60
max_parallel = 1
min_gap_ms = 2000
