[package]
name = "lyrixearch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Find lyrics for your music and embed them in the files (CLI and TUI)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
lyrixearch-core = { version = "0.1.0", path = "../core" }
ratatui = "0.30.2"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1.8"
