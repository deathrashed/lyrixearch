[package]
name = "metal-archives-lyrics"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lyrixearch plugin: lyrics from Metal Archives (encyclopaedia-metallum)"
publish = false

# not part of the Lyrixearch workspace: the plugin is built on its own when installed
[workspace]

[dependencies]
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
