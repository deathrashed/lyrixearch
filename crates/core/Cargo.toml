[package]
name = "lyrixearch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "Lyrics search, matching and tag writing engine behind Lyrixearch"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
dirs = "7.0.0"
html-escape = "0.3.0"
lofty = "0.25.4"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
toml = "1.1.8"
urlencoding = "2.1.3"
walkdir = "2.5.0"

[dev-dependencies]
http = "1.5.0"
