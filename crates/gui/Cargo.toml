[package]
name = "lyrixearch-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "Lyrixearch desktop app (Tauri)"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lyrixearch-core = { version = "0.1.0", path = "../core" }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["unstable", "image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.3", features = ["sync", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSPasteboard", "NSResponder", "NSWindow", "NSGraphics", "NSView", "NSControl", "NSButton"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSGeometry"] }
