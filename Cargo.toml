[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deathrashed/lyrixearch"
authors = ["Lyrixearch contributors"]
readme = "README.md"
keywords = ["lyrics", "music", "id3", "tagging", "tui"]
categories = ["multimedia::audio", "command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
