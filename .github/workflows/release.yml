name: Release

# Push a tag such as v0.1.0 to build the desktop app (macOS, Windows, Linux) and the CLI,
# and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: App ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS (Apple silicon), args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin }
          # GitHub retired the Intel macOS runners: build the Intel app on Apple silicon instead
          - { os: macos-latest, label: macOS (Intel), args: "--target x86_64-apple-darwin", target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, label: Linux, args: "", target: "" }
          - { os: windows-latest, label: Windows, args: "", target: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries (webview, audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/gui
          tagName: ${{ github.ref_name }}
          releaseName: Lyrixearch ${{ github.ref_name }}
          releaseBody: See the README for install notes. Builds are unsigned.
          releaseDraft: true
          args: ${{ matrix.args }}

  cli:
    name: CLI ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: lyrixearch-macos-arm64.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: lyrixearch-macos-x64.tar.gz }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: lyrixearch-linux-x64.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: lyrixearch-windows-x64.zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p lyrixearch --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }} lyrixearch
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/lyrixearch.exe -DestinationPath ${{ matrix.asset }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          draft: true
